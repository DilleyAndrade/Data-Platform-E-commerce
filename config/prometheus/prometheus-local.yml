global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus-alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: "data-platform-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "127.0.0.1:8000"

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets:
          - "127.0.0.1:9091"
